<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body> 
    <nav>
        <ul>
            <li><a href="Index.html">Home</a></li>
            <li><a href="loginPage.html">Campus Navigate</a></li>
            <li><a href="https://fatima.edu.ph/">OLFU</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <div class="login-container">
        <h1>Login to Uni-Navigate</h1>
        <form action="loginPage.html" method="post">
            <div class="logo-container">
                <img src="logo/Uni-Navigate_logo.png" alt="Uni-Navigate Logo">
            </div>
            <div>
                <label for="username">Username:</label><br>
                <input type="text" id="username" name="username"><br><br>
            </div>
            <div>
                <label for="password">Password:</label><br>
                <input type="password" id="password" name="password"><br><br>
            </div>
            <input type="submit" value="Login">
        </form> 
    </div>
</body>
</html>
